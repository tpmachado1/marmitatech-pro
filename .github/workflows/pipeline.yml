name: integracao continua e staging

on:
  push:
    branches: ["develop", "staging"]
  pull_request:
    branches: ["develop"]

jobs:
  # ==========================================
  # ETAPAS EXISTENTES (Completas)
  # ==========================================
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          package-manager-cache: false

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ==========================================
  # ETAPAS DE STAGING
  # ==========================================

  job_release_docker:
    needs: estagio_lint
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Registry (DockerHub)
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/marmitatech-pro:latest

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código para o Sonar
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan de Segurança com Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/marmitatech-pro:latest'
          format: 'json'
          output: 'trivy-report.json'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: SonarQube lendo o Trivy (External Issues)
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.externalIssuesReportPaths=trivy-report.json
            -Dsonar.branch.name=${{ github.ref_name }}

  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Preparar arquivo Compose com o identificador do aluno
        run: |
          cp docker-compose.yml docker-compose-tpmachado1.yml

      - name: Copiar Compose e init.sql para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu # Ajuste para ec2-user se sua instância for Amazon Linux
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "docker-compose-tpmachado1.yml,init.sql"
          target: "/home/ubuntu/marmitatech-pro"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu # Ajuste para ec2-user se sua instância for Amazon Linux
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/marmitatech-pro

            # Executa o init.sql no container MySQL antes de subir a aplicação
            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra mysql -u root -ppassword < init.sql
            echo "✅ init.sql executado com sucesso!"

            # Faz pull da nova imagem e sobe o container da aplicação
            sudo docker compose -f docker-compose-tpmachado1.yml pull
            sudo docker compose -f docker-compose-tpmachado1.yml up -d
            echo "✅ Deploy de tpmachado1 finalizado com sucesso!"
