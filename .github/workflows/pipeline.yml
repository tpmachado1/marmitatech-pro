name: integracao continua e staging

on:
  push:
    branches: ["staging", "develop"]

jobs:
  # ==========================================
  # ETAPAS EXISTENTES (Completas)
  # ==========================================
  estagio_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Verificar sintaxe de todos os arquivos JS
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            ! -path "./.git/*" \
            ! -path "./dist/*" \
            -exec node --check {} \;

  estagio_lint:
    runs-on: ubuntu-latest
    needs: estagio_build
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Gerar lockfile temporário
        run: npm install --package-lock-only

      - name: Instalar dependências
        run: npm install

      - name: Instalar dependências temporárias do lint
        run: npm install --no-save eslint globals

      - name: Criar configuração temporária do ESLint
        run: |
          cat > eslint.config.js <<'EOF'
          const globals = require("globals");

          module.exports = [
            {
              files: ["**/*.js"],
              ignores: ["node_modules/**", ".git/**", "dist/**"],
              languageOptions: {
                ecmaVersion: 2021,
                sourceType: "commonjs",
                globals: {
                  ...globals.node,
                  ...globals.commonjs
                }
              },
              rules: {
                "no-unused-vars": "warn",
                "no-undef": "error"
              }
            }
          ];
          EOF

      - name: Rodar lint
        run: npx eslint .

  job_sonar:
    needs: estagio_lint
    if: github.ref_name == 'staging' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Criar sonar-project.properties dinâmico
        run: |
          echo "sonar.projectKey=${{ github.event.repository.name }}" > sonar-project.properties
          echo "sonar.projectName=${{ github.event.repository.name }}" >> sonar-project.properties
          echo "sonar.branch.name=${{ github.ref_name }}" >> sonar-project.properties
          echo "sonar.sources=." >> sonar-project.properties
          echo "sonar.sourceEncoding=UTF-8" >> sonar-project.properties
          echo "sonar.exclusions=node_modules/**,.git/**,.github/**,coverage/**,dist/**" >> sonar-project.properties

      - name: Exibir configuração do Sonar
        run: cat sonar-project.properties

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://devsecops.dcotech.com.br"
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}

  # ==========================================
  # ETAPAS DE STAGING
  # ==========================================

  job_release_docker:
    needs: estagio_lint
    if: github.ref_name == 'staging' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: TO DO - Checkout do código
        run: echo "Você deve implementar o checkout aqui"

      - name: TO DO - Login no Registry
        run: echo "Você deve implementar o login do Docker aqui"

      - name: TO DO - Build e Push da Imagem
        run: echo "Você deve implementar a criação do artefato (imagem) e o envio pro registry aqui"

  job_trivy_sonar:
    needs: job_release_docker
    if: github.ref_name == 'staging' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: TO DO - Checkout do código para o Sonar
        run: echo "Você deve implementar o checkout com fetch-depth 0 aqui"

      - name: TO DO - Scan de Segurança com Trivy
        run: echo "Você deve implementar a varredura do Trivy gerando o arquivo JSON aqui"

      - name: TO DO - SonarQube lendo o Trivy (External Issues)
        run: echo "Você deve implementar o passo do Sonar injetando o JSON do Trivy aqui"

  job_deploy_staging:
    needs: job_trivy_sonar
    if: github.ref_name == 'staging' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Preparar arquivo Compose com o identificador do aluno
        run: |
          cp docker-compose.yml docker-compose-<aluno>.yml

      - name: Copiar Compose e init.sql para a EC2 (via SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "docker-compose-<aluno>.yml,init.sql"
          target: "/home/${{ secrets.EC2_USER }}/<pastaaluno>"

      - name: Executar o Deploy na EC2 (via SSH)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USER }}/<pastaaluno>

            echo "⏳ Executando init.sql no container mysql-infra..."
            sudo docker exec -i mysql-infra \
              mysql -u root -ppassword < init.sql

            echo "✅ init.sql executado com sucesso!"

            sudo docker compose -f docker-compose-<aluno>.yml pull
            sudo docker compose -f docker-compose-<aluno>.yml up -d

            echo "✅ Deploy do aluno finalizado com sucesso!"
